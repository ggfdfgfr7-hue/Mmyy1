<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahmoud Youssef | Quad View</title>

<style>
:root {
  --bg: #080d1b;
  --bar: #141b2b;
  --line: #27334a;
  --text: #f1f5ff;
  --accent: #28d9ff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

/* Header */
.header {
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 10px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}

.name {
  font-size: 19px;
  font-weight: 700;
}

.crown {
  font-size: 21px;
}

/* Grid layout */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 3px;
  flex: 1;
  min-height: 0;
  background: var(--line);
}

.pane {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  background: var(--bg);
}

.bar {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px;
  background: var(--bar);
  flex-shrink: 0;
}

.title {
  flex: 1;
  font-size: 12px;
  font-weight: bold;
}

.btn {
  padding: 5px 7px;
  color: var(--text);
  background: #1b263b;
  border: 1px solid #35435c;
  border-radius: 5px;
  font-size: 11px;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
}

iframe {
  flex: 1;
  width: 100%;
  min-height: 0;
  border: 0;
  background: white;
}

/* Poster Overlay */
.poster-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  background: #050816;
}

.poster-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

/* Small and neat close button */
.close-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  z-index: 10000;
  backdrop-filter: blur(4px);
}

.close-btn:hover {
  background: rgba(255, 255, 255, 0.3);
}

/* Error message in English if image is missing */
.poster-error {
  display: none;
  max-width: 420px;
  padding: 28px;
  text-align: center;
  line-height: 1.7;
  color: white;
}

.poster-error strong {
  color: var(--accent);
}

/* Small screens */
@media (max-width: 800px) {
  .grid {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(4, 80vh);
    overflow-y: auto;
  }

  .poster-image {
    object-fit: contain;
  }
}
</style>
</head>

<body>

<header class="header">
  <span class="name">Mahmoud Youssef</span>

<main class="grid" id="grid"></main>

<div class="poster-overlay" id="posterOverlay">

  <img
    class="poster-image"
    id="posterImage"

  >

    <strong>Top AI Tools — 100% FREE</strong>
    <p>Poster image not found.</p>
    <p>Please make sure to upload an image named <b>poster.png</b> in the exact same folder as index.html.</p>
  </div>
</div>
