<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quad View</title>
<style>
  :root {
    --bg: #14171c;
    --bar: #1d2128;
    --line: #2c323c;
    --text: #e8ebf0;
    --muted: #8d97a6;
    --accent: #3b82f6;
    --gold: #f5c542;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .crown {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 0 6px rgba(245, 197, 66, 0.5));
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    width: 100%;
    flex: 1;
    min-height: 0;
    background: var(--line);
  }
  .grid.focus { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .grid.focus .pane:not(.active) { display: none; }
  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--bg);
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .title { font-size: 13px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { background: #262c35; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }

  @media (max-width: 800px) {
    html, body { height: auto; }
    .grid { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: 80vh; flex: none; }
    .grid.focus { grid-auto-rows: 100vh; }
  }

  /* ===== الاستيكر (ملء الشاشة) ===== */
  #articleSticker {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #0b0d11;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #articleSticker .sticker-link {
    display: block;
    width: 100%;
    height: 100%;
  }
  #articleSticker img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* غيّرها لـ cover لو عايز الصورة تملا من غير هوامش */
    display: block;
  }
  /* زرار X صغير من غير خلفية */
  #articleSticker .sticker-close {
    position: absolute;
    top: 4px;
    right: 6px;
    width: 16px;
    height: 16px;
    border: none;
    background: none;
    color: #fff;
    font-size: 14px;
    line-height: 16px;
    text-align: center;
    cursor: pointer;
    z-index: 2;
    padding: 0;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
</style>
</head>

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = 'Link ' + (i + 1);

    const reload = document.createElement('button');
    reload.className = 'btn';
    reload.textContent = 'Reload';

    const expand = document.createElement('button');
    expand.className = 'btn';
    expand.textContent = 'Expand';
    expand.setAttribute('data-exp', '1');

    const open = document.createElement('a');
    open.className = 'btn';
    open.textContent = 'Open in new tab';
    open.href = url;
    open.target = '_blank';
    open.rel = 'noopener';

    const frame = document.createElement('iframe');
    frame.title = 'Link ' + (i + 1);
    frame.src = url;
    frame.allow = 'fullscreen';

    reload.addEventListener('click', function () { frame.src = frame.src; });

    expand.addEventListener('click', function () {
      const isActive = pane.classList.contains('active');
      document.querySelectorAll('.pane').forEach(function (p) {
        p.classList.remove('active');
        p.querySelector('[data-exp]').textContent = 'Expand';
      });
      grid.classList.remove('focus');
      if (!isActive) {
        pane.classList.add('active');
        grid.classList.add('focus');
        expand.textContent = 'Collapse';
      }
    });

    bar.append(title, reload, expand, open);
    pane.append(bar, frame);
    grid.appendChild(pane);
  });

  // ===== رابط المقالة (اختياري): حط رابط مقالتك بين العلامتين، أو سيبه فاضي =====
  const ARTICLE_URL = "";
  const sl = document.getElementById('stickerLink');
  if (ARTICLE_URL) { sl.href = ARTICLE_URL; } else { sl.style.cursor = 'default'; }

  // ===== إغلاق الاستيكر =====
  function closeSticker() {
    document.getElementById('articleSticker').style.display = 'none';
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSticker();
  });
</script>

</body>
</html>
